    <title>AI 助手</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f5f7fa;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        /* 登录界面的样式 */
        #login-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 80%;
            max-width: 320px;
            border: 1px solid #eee;
        }
        .login-box h2 { margin-top: 0; color: #333; font-size: 20px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-box button:hover { background: #4338ca; }
    </style>
</head>
<body>

<!-- 登录界面（默认显示） -->
<div id="login-modal">
    <div class="login-box">
        <h2>👋 欢迎使用小智</h2>
        <p style="color: #666; font-size: 14px;">请输入你的学号或姓名开始对话</p>
        <input type="text" id="username-input" placeholder="例如：40101" autocomplete="off">
        <button onclick="handleLogin()">开始对话</button>

</div>

    // ==================== 用私钥签署 JWT ====================
    function signJWT(appId, kid, privateKey, sessionName) {
        const header = {
            alg: 'RS256',
            typ: 'JWT',
            kid: kid
        };

        const now = Math.floor(Date.now() / 1000);
        const payload = {
            iss: appId,
            aud: 'api.coze.cn',
            iat: now,
            exp: now + 3600,
            jti: 'jti_' + Date.now() + '_' + Math.random().toString(36).slice(2),
            session_name: sessionName  // 🔴 每个学生手动输入的账号
        };

        const sHeader = JSON.stringify(header);
        const sPayload = JSON.stringify(payload);
        return KJUR.jws.JWS.sign('RS256', sHeader, sPayload, privateKey);
    }

    // ==================== 用 JWT 换取 Access Token ====================
    async function getAccessToken(jwt) {
        const resp = await fetch('https://api.coze.cn/api/permission/oauth2/token', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + jwt
            },
            body: JSON.stringify({
                duration_seconds: 86399,
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer'
            })
        });

        if (!resp.ok) {
            const err = await resp.text();
            throw new Error('获取 Access Token 失败: ' + err);
        }
        const data = await resp.json();
        return data.access_token;
    }

    // ==================== 页面加载时检查是否已有账号 ====================
    window.onload = function() {
        const savedId = localStorage.getItem('coze_student_id');
        if (savedId) {
            // 如果以前登录过，直接进入聊天
            document.getElementById('login-modal').style.display = 'none';
            initCoze(savedId);
        }
        // 如果没有登录过，就会停留在输入账号的界面，等待点击按钮
    };

    // ==================== 点击“开始对话”按钮 ====================
    function handleLogin() {
        const inputVal = document.getElementById('username-input').value.trim();
        if (!inputVal) {
            alert('请输入你的学号或姓名哦！');
            return;
        }
        
        // 把学生输入的账号保存到本地，下次打开就不用再输了
        localStorage.setItem('coze_student_id', inputVal);
        
        // 隐藏登录框
        document.getElementById('login-modal').style.display = 'none';
        
        // 初始化智能体
        initCoze(inputVal);
    }

    // 支持在输入框按回车键直接提交
    document.getElementById('username-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleLogin();
        }
    });

    // ==================== 初始化 Coze ====================
    async function initCoze(studentId) {
        try {
            // 如果已经初始化过了，就不再重复初始化
            if (cozeWebSDK) return;

            // 1. 签署 JWT
            const jwt = signJWT(
                COZE_CONFIG.appId,
                COZE_CONFIG.kid,
                COZE_CONFIG.privateKey,
                studentId
            );

            // 2. 换取临时 Access Token
            const accessToken = await getAccessToken(jwt);

            // 3. 初始化 Chat SDK
            cozeWebSDK = new CozeWebSDK.WebChatClient({
                config: {
                    type: 'bot',
                    botId: COZE_CONFIG.botId,
                    isIframe: false
                },
                auth: {
                    type: 'token',
                    token: accessToken,
                    onRefreshToken: async () => {
                        const newJwt = signJWT(
                            COZE_CONFIG.appId,
                            COZE_CONFIG.kid,
                            COZE_CONFIG.privateKey,
                            studentId
                        );
                        return await getAccessToken(newJwt);
                    }
                },
                userInfo: {
                    id: studentId,          // 使用学生输入的账号
                    nickname: studentId     // 昵称也用账号，方便显示
                },
                ui: {
                    base: {
                        layout: 'mobile',
                        lang: 'zh-CN',
                        zIndex: 1000
                    },
                    asstBtn: {
                        isNeed: false
                    },
                    header: {
                        isShow: true,
                        isNeedClose: false
                    },
                    chatBot: {
                        title: 'AI 助手',
                        uploadable: true
                    }
                }
            });

            cozeWebSDK.showChatBot();

        } catch (e) {
            console.error('初始化失败:', e);
            alert('初始化失败，请检查配置或联系老师。\n' + e.message);
            // 如果失败了，把登录框放出来让学生重试
            document.getElementById('login-modal').style.display = 'flex';
            localStorage.removeItem('coze_student_id'); 
        }
    }
